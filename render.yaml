services:
  - type: web
    name: pet-hydro-feed-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: ./data/pets.db
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
